<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <header>
        <nav class="navbar">
            <div class="logo">placeholder</div>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#interests">Interests</a>
                <a href="#gallery">Gallery</a>
            </div>
        </nav>
    </header>

    <main>

        <section id="home" class="hero">
            <div class="hero-content">
                <p class="eyebrow">placeholder</p>
                <h1>placeholder</h1>
                <p class="hero-description">placeholder</p>
                <a href="#about" class="main-button">Explore More <span>↗</span></a>
            </div>

            <div class="hero-decoration">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="orbit orbit-three"></div>
                <div class="orbit-center"></div>
            </div>
        </section>

        <section id="about" class="content-section">
            <div class="section-heading">
                <span class="section-number">01 /</span>
                <h2>About Me</h2>
            </div>

            <div class="content-card about-card">placeholder</div>
        </section>

        <section id="interests" class="content-section">
            <div class="section-heading">
                <span class="section-number">02 /</span>
                <h2>My Interests</h2>
            </div>

            <div class="interest-grid">
                <div class="content-card interest-card">placeholder</div>
                <div class="content-card interest-card">placeholder</div>
                <div class="content-card interest-card">placeholder</div>
            </div>
        </section>

        <section id="gallery" class="content-section">
            <div class="section-heading">
                <span class="section-number">03 /</span>
                <h2>My Gallery</h2>
            </div>

            <div class="gallery-grid">
                <div class="gallery-item">placeholder</div>
                <div class="gallery-item">placeholder</div>
                <div class="gallery-item">placeholder</div>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-line"></div>
        <p>placeholder</p>
    </footer>

</body>
</html>
